
name: Build n8n ARM64 Deployment Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM --platform=linux/arm64 docker.n8n.io/n8nio/n8n:latest
          EOF

      - name: Build ARM64 Docker image archive
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --output type=docker,dest=n8n-snapdeploy-arm64.tar \
            -t n8n:latest \
            .

      - name: Verify archive
        run: |
          test -s n8n-snapdeploy-arm64.tar
          tar -tf n8n-snapdeploy-arm64.tar | grep -q manifest.json

      - name: Load and verify image architecture
        run: |
          docker load -i n8n-snapdeploy-arm64.tar

          ARCH=$(docker image inspect n8n:latest \
            --format '{{.Os}}/{{.Architecture}}')

          echo "Detected architecture: $ARCH"

          test "$ARCH" = "linux/arm64"

      - name: Upload final archive
        uses: actions/upload-artifact@v4
        with:
          name: snapdeploy-n8n-arm64-final
          path: n8n-snapdeploy-arm64.tar
          if-no-files-found: error
          retention-days: 7
