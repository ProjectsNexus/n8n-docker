
name: Export n8n ARM64 for SnapDeploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Pull official n8n ARM64 image
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if docker pull --platform linux/arm64 n8nio/n8n:latest; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Image pull failed after 3 attempts"
              exit 1
            fi
            sleep 30
          done

      - name: Tag image
        run: |
          docker tag n8nio/n8n:latest n8n:latest

      - name: Verify architecture
        shell: bash
        run: |
          ARCH=$(docker image inspect n8n:latest \
            --format '{{.Os}}/{{.Architecture}}')
          echo "Detected architecture: $ARCH"
          test "$ARCH" = "linux/arm64"

      - name: Create Docker save archive
        run: |
          docker save -o n8n-snapdeploy-arm64.tar n8n:latest

      - name: Verify Docker archive
        run: |
          test -s n8n-snapdeploy-arm64.tar
          tar -tf n8n-snapdeploy-arm64.tar | grep -q manifest.json
          echo "Docker archive verified"

      - name: Upload final archive
        uses: actions/upload-artifact@v4
        with:
          name: n8n-snapdeploy-arm64
          path: n8n-snapdeploy-arm64.tar
          if-no-files-found: error
          retention-days: 7
