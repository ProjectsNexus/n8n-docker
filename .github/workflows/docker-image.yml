
name: Build n8n ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --load \
            -t n8n-snapdeploy:arm64 \
            .

      - name: Verify architecture
        run: |
          docker image inspect n8n-snapdeploy:arm64 \
            --format '{{.Os}}/{{.Architecture}}'

          test "$(docker image inspect n8n-snapdeploy:arm64 --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"

      - name: Export TAR
        run: |
          docker save \
            -o n8n-snapdeploy-arm64.tar \
            n8n-snapdeploy:arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-snapdeploy-arm64-final
          path: n8n-snapdeploy-arm64.tar
          retention-days: 7
