
name: n8n ARM64 for SnapDeploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dockerfile
        shell: bash
        run: |
          cat > Dockerfile <<'EOF'
          FROM n8nio/n8n:latest
          EOF

      - name: Build actual ARM64 image
        shell: bash
        run: |
          set -e

          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --load \
            --tag n8n:latest \
            .

      - name: Verify actual image architecture
        shell: bash
        run: |
          set -e

          docker image inspect n8n:latest > image-inspect.json

          OS=$(jq -r '.[0].Os' image-inspect.json)
          ARCH=$(jq -r '.[0].Architecture' image-inspect.json)

          echo "Detected OS: $OS"
          echo "Detected Architecture: $ARCH"

          if [ "$OS" != "linux" ] || [ "$ARCH" != "arm64" ]; then
            echo "ERROR: Wrong image architecture"
            cat image-inspect.json
            exit 1
          fi

          echo "SUCCESS: Real ARM64 image verified"

      - name: Create Docker save archive
        shell: bash
        run: |
          set -e
          docker save -o n8n-snapdeploy-arm64.tar n8n:latest

      - name: Verify Docker save archive
        shell: bash
        run: |
          set -e

          test -s n8n-snapdeploy-arm64.tar

          tar -tf n8n-snapdeploy-arm64.tar \
            | grep -q '^manifest.json$'

          echo "Docker save archive created successfully"
          ls -lh n8n-snapdeploy-arm64.tar

      - name: Upload final TAR
        uses: actions/upload-artifact@v4
        with:
          name: n8n-snapdeploy-arm64-final
          path: n8n-snapdeploy-arm64.tar
          if-no-files-found: error
          retention-days: 7
