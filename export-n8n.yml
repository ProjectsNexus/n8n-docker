
name: n8n Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Pull official n8n image
        run: |
          docker pull docker.n8n.io/n8nio/n8n:latest

      - name: Tag image
        run: |
          docker tag docker.n8n.io/n8nio/n8n:latest n8n:latest

      - name: Verify image
        run: |
          docker image inspect n8n:latest

      - name: Export Docker image
        run: |
          docker save -o n8n-image.tar n8n:latest

      - name: Verify Docker archive
        run: |
          test -s n8n-image.tar
          tar -tf n8n-image.tar | head -20
          tar -tf n8n-image.tar | grep -q manifest.json

      - name: Upload Docker archive
        uses: actions/upload-artifact@v4
        with:
          name: n8n-docker-image
          path: n8n-image.tar
          if-no-files-found: error
          retention-days: 7
